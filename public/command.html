<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <title>Nexus Command</title>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        body {
            background-color: #020617;
            overscroll-behavior-y: contain;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
        }

        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
        }

        .message-in {
            animation: slideIn 0.2s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="flex flex-col h-[100dvh] bg-slate-950 overflow-hidden text-slate-100">

    <!-- Modal de Configuración (Solo se muestra si faltan credenciales) -->    <div id="setup-modal" class="hidden fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-4">
        <div class="w-full max-w-sm space-y-6 max-h-[90dvh] overflow-y-auto px-2">
            <div class="text-center pt-4">
                <div
                    class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-indigo-500/20">
                    <i data-lucide="settings-2" class="text-white w-8 h-8"></i>
                </div>
                <h2 class="text-xl font-bold text-white">Configuración Nexus</h2>
                <p class="text-slate-400 text-xs mt-2">Introduce tus credenciales de Supabase para activar el enlace
                    neural.</p>
            </div>
            <div class="space-y-4 pb-8">
                <input type="text" id="set-url" placeholder="Supabase URL (https://...)"
                    class="w-full bg-slate-900 border border-white/10 rounded-xl p-4 text-sm focus:border-indigo-500 outline-none transition-all">
                <input type="password" id="set-key" placeholder="Anon Public Key"
                    class="w-full bg-slate-900 border border-white/10 rounded-xl p-4 text-sm focus:border-indigo-500 outline-none transition-all">
                <input type="text" id="set-bridge" placeholder="Beatriz Bridge URL (ngrok)"
                    class="w-full bg-slate-900 border-2 border-orange-500/50 rounded-xl p-4 text-sm focus:border-orange-500 outline-none transition-all placeholder:text-orange-300/50">
                <div class="p-3 bg-orange-500/10 border border-orange-500/20 rounded-xl">
                    <p class="text-[10px] text-orange-400 leading-tight">⚠️ IMPORTANTE: Sin la URL de ngrok (Bridge URL), el Fénix no recibirá tus mensajes.</p>
                </div>
                <div class="text-center opacity-20 text-[8px] font-mono mt-4">
                    Neural Nexus Command v2.8 - Iron Wing
                </div>
                <button onclick="saveConfig()"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-600/20 active:scale-95 transition-all">
                    CONECTAR SISTEMA
                </button>
            </div>
        </div>
    </div>

    <header class="glass p-4 border-b border-white/5 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="/" class="p-2 bg-white/5 rounded-lg text-slate-400 hover:text-white transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </a>
            <div
                class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i data-lucide="cpu" class="text-white w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-xs font-black tracking-widest text-white uppercase">Nexus Command</h1>
                <div class="flex items-center gap-1.5">
                    <span id="status-dot" class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
                    <span id="status-text" class="text-[9px] text-slate-400 font-mono uppercase">Offline</span>
                </div>
            </div>
        </div>
        <button onclick="toggleSetup()" class="p-2 bg-white/5 rounded-lg text-slate-400"><i data-lucide="settings"
                class="w-4 h-4"></i></button>
    </header>

    <main id="chat-flow" class="flex-1 overflow-y-auto p-4 space-y-4 hide-scrollbar">
        <!-- Los mensajes aparecerán aquí -->
    </main>

    <div id="loader"
        class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 border border-white/20">
        <i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i>
        <span class="text-[10px] font-bold uppercase tracking-tighter">Sincronizando...</span>
    </div>

    <footer class="p-4 bg-slate-900 border-t border-white/5 pb-[max(4rem,env(safe-area-inset-bottom))] sm:pb-4">
        <div class="flex items-end gap-2 max-w-lg mx-auto">
            <div
                class="flex-1 bg-slate-800/50 rounded-2xl border border-white/5 p-2 focus-within:border-indigo-500/40 transition-all">
                <textarea id="input-msg" placeholder="Escribe a Beatriz..."
                    class="w-full bg-transparent border-none focus:ring-0 text-sm text-white px-2 py-1 min-h-[40px] max-h-32 resize-none"
                    rows="1"></textarea>
                <div class="flex items-center justify-between px-1">
                    <button id="img-label" onclick="document.getElementById('img-up').click()"
                        class="p-2 text-slate-500 hover:text-white transition-colors rounded-lg"><i data-lucide="image"
                            class="w-5 h-5"></i></button>
                    <input type="file" id="img-up" class="hidden" accept="image/*">
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <button id="rec-btn"
                    class="p-4 rounded-2xl bg-slate-800 text-slate-400 active:scale-90 transition-transform"><i
                        data-lucide="mic" class="w-6 h-6"></i></button>
                <button id="send-btn"
                    class="p-4 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/20 active:scale-95 transition-transform"><i
                        data-lucide="send-horizontal" class="w-6 h-6"></i></button>
            </div>
        </div>
    </footer>

    <script>
        let sb = null;
        let tableName = 'messages';
        let pendingImage = null;
        const uid = localStorage.getItem('nexus_uid') || `usr_${Math.random().toString(36).substr(2, 5)}`;
        localStorage.setItem('nexus_uid', uid);

        async function initSupabase() {
            const url = localStorage.getItem('nexus_sb_url');
            const key = localStorage.getItem('nexus_sb_key');

            if (!url || !key || url.includes("TU_SUPABASE")) {
                document.getElementById('setup-modal').classList.remove('hidden');
                return;
            }

            try {
                sb = supabase.createClient(url, key);
                
                document.getElementById('setup-modal').classList.add('hidden');
                if (sb) {
                    const bridge = localStorage.getItem('nexus_bridge_url');
                    document.getElementById('status-dot').className = bridge ? 'w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'w-1.5 h-1.5 rounded-full bg-orange-500';
                    document.getElementById('status-text').innerText = bridge ? 'Beatriz Link Active' : 'Supabase Only (No Bridge)';
                    document.getElementById('status-text').className = bridge ? 'text-[9px] text-emerald-400 font-mono uppercase' : 'text-[9px] text-orange-400 font-mono uppercase';
                    loadMessages();
                    subscribe();
                }
            } catch (e) {
                console.error(e);
                alert("Error de conexión. Verifica la URL.");
                toggleSetup();
            }
        }

        function saveConfig() {
            const url = document.getElementById('set-url').value.trim();
            const key = document.getElementById('set-key').value.trim();
            const bridge = document.getElementById('set-bridge').value.trim();
            if (url && key) {
                localStorage.setItem('nexus_sb_url', url);
                localStorage.setItem('nexus_sb_key', key);
                if (bridge) localStorage.setItem('nexus_bridge_url', bridge);
                initSupabase();
            }
        }

        function toggleSetup() {
            document.getElementById('setup-modal').classList.toggle('hidden');
        }

        async function loadMessages() {
            try {
                let { data, error } = await sb.from(tableName).select('*').order('created_at').limit(50);
                if (data) {
                    document.getElementById('chat-flow').innerHTML = '';
                    data.forEach(renderMsg);
                }
            } catch (e) { console.error("Load Error:", e); }
        }

        function renderMsg(m) {
            const isMe = m.sender_id === uid;
            const isAI = m.sender_id === 'BEATRIZ_AI';
            const chat = document.getElementById('chat-flow');
            const div = document.createElement('div');
            div.className = `flex w-full mb-4 ${isMe ? 'justify-end' : 'justify-start'} message-in`;

            let content = '';
            if (m.type === 'text') {
                if (m.content.startsWith('[VOICE] ')) {
                    const url = m.content.substring(8);
                    content = `
                        <div class="flex items-center gap-3 py-1">
                            <button onclick="playVoice(this, '${url}')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center shadow-inner shadow-white/5"><i data-lucide="play" class="w-4 h-4 text-white"></i></button>
                            <div class="text-[10px] font-mono opacity-50 uppercase tracking-widest">Nota de Voz</div>
                        </div>`;
                } else if (m.content.startsWith('[IMAGE] ')) {
                    const url = m.content.substring(8);
                    content = `<img src="${url}" class="rounded-lg max-w-full border border-white/5 shadow-2xl">`;
                } else {
                    content = `<p class="text-sm leading-relaxed">${m.content}</p>`;
                }
            }
            else if (m.type === 'image') content = `<img src="${m.content}" class="rounded-lg max-w-full border border-white/5 shadow-2xl">`;
            else if (m.type === 'voice') content = `
                <div class="flex items-center gap-3 py-1">
                    <button onclick="playVoice(this, '${m.content}')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center shadow-inner shadow-white/5"><i data-lucide="play" class="w-4 h-4 text-white"></i></button>
                    <div class="text-[10px] font-mono opacity-50 uppercase tracking-widest">Nota de Voz</div>
                </div>`;

            div.innerHTML = `
                <div class="max-w-[85%] px-4 py-3 rounded-2xl shadow-lg ${isAI ? 'bg-slate-800 border border-indigo-500/30 text-indigo-50 rounded-bl-none' :
                    isMe ? 'bg-indigo-600 text-white rounded-br-none shadow-indigo-600/20' :
                        'bg-slate-700 text-white rounded-bl-none'
                }">
                    ${isAI ? '<div class="text-[8px] font-bold text-indigo-400 mb-1 tracking-widest uppercase">Beatriz AI</div>' : ''}
                    ${content}
                </div>`;
            chat.appendChild(div);
            lucide.createIcons();
            chat.scrollTop = chat.scrollHeight;
        }

        async function push(type, content) {
            if (!sb) return;
            await sb.from(tableName).insert([{ type, content, sender_id: uid }]);
            
            // --- SYNC TO BEATRIZ NUCLEUS ---
            const bridgeUrl = localStorage.getItem('nexus_bridge_url');
            if (bridgeUrl) {
                try {
                    const msg = type === 'image' ? `[IMAGE] ${content}` : content;
                    fetch(`${bridgeUrl}/chat/portal`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: msg })
                    });
                } catch (e) { console.error("Bridge Sync Error:", e); }
            }
        }

        async function upload(file) {
            document.getElementById('loader').classList.remove('hidden');
            const name = `nexus_${Date.now()}.${file.name?.split('.').pop() || 'webm'}`;
            const { data, error } = await sb.storage.from('messages-images').upload(name, file);
            if (error) { document.getElementById('loader').classList.add('hidden'); return null; }
            const { data: { publicUrl } } = sb.storage.from('messages-images').getPublicUrl(name);
            document.getElementById('loader').classList.add('hidden');
            return publicUrl;
        }

        document.getElementById('send-btn').onclick = () => {
            const v = document.getElementById('input-msg').value.trim();
            if (v || pendingImage) {
                let finalMsg = v;
                if (pendingImage) {
                    finalMsg = v ? `${v} [IMAGE] ${pendingImage}` : `[IMAGE] ${pendingImage}`;
                    // En Supabase lo guardamos como texto combinado para que sea un solo bloque
                    push('text', finalMsg);
                } else {
                    push('text', v);
                }
                
                document.getElementById('input-msg').value = '';
                pendingImage = null;
                document.getElementById('img-label').classList.remove('text-indigo-500', 'bg-indigo-500/20');
            }
        };

        document.getElementById('img-up').onchange = async (e) => {
            if (!e.target.files[0]) return;
            const url = await upload(e.target.files[0]);
            if (url) {
                pendingImage = url;
                // Feedback visual de imagen cargada
                document.getElementById('img-label').classList.add('text-indigo-500', 'bg-indigo-500/20');
                console.log("📸 Imagen lista para enviar:", url);
            }
        };

        let rec, chunks = [];
        document.getElementById('rec-btn').onclick = async () => {
            if (!rec || rec.state === 'inactive') {
                const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                rec = new MediaRecorder(s);
                chunks = [];
                rec.ondataavailable = e => chunks.push(e.data);
                rec.onstop = async () => {
                    const b = new Blob(chunks, { type: 'audio/webm' });
                    const url = await upload(b);
                    if (url) push('voice', url);
                };
                rec.start();
                document.getElementById('rec-btn').classList.add('bg-red-500', 'animate-pulse');
            } else {
                rec.stop();
                document.getElementById('rec-btn').classList.remove('bg-red-500', 'animate-pulse');
            }
        };

        window.playVoice = (btn, url) => {
            if (btn.audio) { btn.audio.paused ? btn.audio.play() : btn.audio.pause(); return; }
            const a = new Audio(url); btn.audio = a; a.play();
        };

        function subscribe() {
            sb.channel(tableName).on('postgres_changes', { event: 'INSERT', schema: 'public', table: tableName }, p => renderMsg(p.new)).subscribe();
            
            // Poll for Beatriz Outbox
            setInterval(async () => {
                const bridgeUrl = localStorage.getItem('nexus_bridge_url');
                if (!bridgeUrl) return;
                try {
                    const res = await fetch(`${bridgeUrl}/chat/outbox`);
                    if (!res.ok) throw new Error("Status " + res.status);
                    const data = await res.json();
                    
                    if (data.success && data.messages) {
                        data.messages.forEach(msg => {
                            // Usar un set de IDs en localStorage para no repetir
                            const msgId = btoa(msg).substring(0, 16);
                            const seen = JSON.parse(localStorage.getItem('nexus_seen_msgs') || '[]');
                            
                            if (!seen.includes(msgId)) {
                                let type = 'text';
                                let content = msg;

                                if (msg.startsWith('[VOICE] ')) {
                                    type = 'voice';
                                    content = msg.substring(8);
                                } else if (msg.startsWith('[IMAGE] ')) {
                                    type = 'image';
                                    content = msg.substring(8);
                                }

                                renderMsg({ sender_id: 'BEATRIZ_AI', type, content });
                                seen.push(msgId);
                                localStorage.setItem('nexus_seen_msgs', JSON.stringify(seen.slice(-50)));
                            }
                        });
                    }
                } catch (e) {
                    console.warn("Outbox Poll Error:", e);
                }
            }, 5000);
        }

        window.onload = () => {
            lucide.createIcons();
            initSupabase();
        };
    </script>
</body>

</html>
