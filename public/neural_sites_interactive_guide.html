                                    </div>

                                    <p className="text-[11px] text-gray-400">
                                        Sin compromisos ni pagos por adelantado. Te enviaremos tu enlace temporal a WhatsApp.
                                    </p>
                                </div>

                            </div>
                        )}

                        {/* REGISTRO DE EVENTOS CENTINELA */}
                        <div className="mt-16 glass-panel rounded-2xl p-4 sm:p-6 border border-gray-800 space-y-3">
                            <div className="flex items-center justify-between text-xs font-mono border-b border-gray-800 pb-2">
                                <span className="text-cyan-400 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                                    CENTINELA MONITOREO EN VIVO
                                </span>
                                <span className="text-gray-500">{eventsLog.length} Eventos Registrados</span>
                            </div>

                            <div className="space-y-1 font-mono text-[11px] max-h-36 overflow-y-auto">
                                {eventsLog.map(ev => (
                                    <div key={ev.id} className="flex items-center justify-between py-1 px-2 rounded bg-gray-950/60 border border-gray-900 text-gray-400">
                                        <span className="text-gray-600">{ev.time}</span>
                                        <span className="text-purple-400 font-semibold">{ev.event}</span>
                                        <span className="text-gray-300 truncate max-w-xs">{ev.details}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                    </main>

                    {/* Pie de Página */}
                    <footer className="border-t border-gray-900 glass-panel mt-16 px-6 py-6 text-center text-xs text-gray-500 font-mono">
                        <p>© 2026 Neural Sites & Neural Nexus. Todos los derechos reservados.</p>
                        <p className="mt-1 text-[10px] text-gray-600">Guía Interactiva & Generador de Sitios Inteligentes con Beatriz AI</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
